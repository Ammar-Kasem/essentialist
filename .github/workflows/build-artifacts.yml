name: Build Artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: flashdown-linux-amd64
          - goos: linux
            goarch: arm64
            binary: flashdown-linux-arm64
          - goos: darwin
            goarch: amd64
            binary: flashdown-macos-amd64
          - goos: darwin
            goarch: arm64
            binary: flashdown-macos-arm64
          - goos: windows
            goarch: amd64
            binary: flashdown-windows-amd64.exe
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Flashdown
        run: go build -trimpath -o "${{ matrix.binary }}" ./cmd/flashdown
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
